complexity:
  CyclomaticComplexMethod:
    active: true
  LargeClass:
    active: true
  LongMethod:
    active: true

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

naming:
  FunctionNaming:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

style:
  # app code uses lock-aware wrappers in place of these: a picker result arrives before the PIN is
  # entered, so it must wait for unlock, and Compose dialogs, sheets, and menus open windows above
  # the lock screen, so the wrappers in org.bitcoinppl.cove.views.lockaware hide or close them
  ForbiddenImport:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/screenshotTest/**'
      - '**/views/LockAwareActivityResult.kt'
    forbiddenImports:
      - value: 'androidx.activity.compose.rememberLauncherForActivityResult'
        reason: 'Use rememberLockAwareLauncherForActivityResult so results wait for unlock'
      - value: 'androidx.compose.material3.AlertDialog'
        reason: 'Use org.bitcoinppl.cove.views.lockaware.AlertDialog, which hides while the app is locked'
      - value: 'androidx.compose.material3.BasicAlertDialog'
        reason: 'Use org.bitcoinppl.cove.views.lockaware.AlertDialog, which hides while the app is locked'
      - value: 'androidx.compose.material3.ModalBottomSheet'
        reason: 'Use org.bitcoinppl.cove.views.lockaware.ModalBottomSheet, which hides while the app is locked'
      - value: 'androidx.compose.material3.DropdownMenu'
        reason: 'Use org.bitcoinppl.cove.views.lockaware.DropdownMenu, which closes while the app is locked'
      - value: 'androidx.compose.ui.window.Dialog'
        reason: 'Use org.bitcoinppl.cove.views.lockaware.Dialog, which hides while the app is locked'
      - value: 'androidx.compose.ui.window.Popup'
        reason: 'Add a wrapper in org.bitcoinppl.cove.views.lockaware so it hides or closes while the app is locked'
  # release builds keep android.util.Log output in logcat, which diagnostics reports read, so app code
  # goes through org.bitcoinppl.cove.Log, which drops debug lines outside debug builds
  ForbiddenMethodCall:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/androidTestUiTest/**'
      - '**/src/testUiTest/**'
      - '**/src/screenshotTest/**'
      - '**/src/main/java/org/bitcoinppl/cove/Log.kt'
    methods:
      - value: 'android.util.Log.v'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.d'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.i'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.w'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.e'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.wtf'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
      - value: 'android.util.Log.println'
        reason: 'Use org.bitcoinppl.cove.Log, which keeps debug lines out of release logcat'
  UnusedPrivateFunction:
    allowedNames: '.*Preview.*'
