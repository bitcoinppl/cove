complexity:
  CyclomaticComplexMethod:
    active: true
  LargeClass:
    active: true
  LongMethod:
    active: true

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true

naming:
  FunctionNaming:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

style:
  ForbiddenImport:
    active: true
    # a picker result arrives before the PIN is entered, so it must wait for unlock
    forbiddenImports:
      - value: 'androidx.activity.compose.rememberLauncherForActivityResult'
        reason: 'Use rememberLockAwareLauncherForActivityResult so results wait for unlock'
    excludes:
      - '**/views/LockAwareActivityResult.kt'
  UnusedPrivateFunction:
    allowedNames: '.*Preview.*'
