name: UI tests

# emulator and simulator suites take far longer than the rest of CI, so they
# run nightly, on PRs that opt in with the `ui-tests` label, and, for Android
# only, after merge.
# iOS runs only nightly and in manual runs: its shards hold three of GitHub's
# few macOS runners for well over an hour each, so iOS UI runs for a PR happen
# locally with cove-local-ci or through a manual run, and a push to master
# leaves them to the next nightly.
# A labeled PR runs only the Android suites, and only when its changes reach
# Android.
# A manual run can name tests to run instead of the full suites, to check a fix
# without waiting on every test again, and then runs only the platforms whose
# tests it names; see docs/testing.md
on:
  workflow_dispatch:
    inputs:
      ios_tests:
        description: "iOS tests to run, comma-separated <Target>/<Class>[/<method>]; empty with android_tests empty runs everything"
        required: false
        default: ""
      android_tests:
        description: "Android tests to run, comma-separated <package>.<Class>[#<method>]"
        required: false
        default: ""
  schedule:
    # 08:00 UTC is 03:00 US Central during daylight time and 02:00 in winter
    - cron: "0 8 * * *"
  push:
    branches:
      - master
  # any base branch, so stacked PRs can opt in too; the job condition checks the label
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# a newer run on the same ref replaces an older one, but the nightly and manual runs have groups of
# their own, since a push to master cancelled every nightly it overlapped and would cancel a manual
# run's iOS shards without running iOS again
concurrency:
  group: ui-tests-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

# caches save only from runs on master, as each rust-cache step's save-if says: a pull request or
# branch run can read master's caches but no other branch's, and the repository's caches share
# 10 GB, so entries saved for one branch pushed out the master entries every run starts from
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  # every iOS suite a full run covers, comma-separated; the rest of CoveCloudBackupUITests stays
  # out until its inventory scenarios pass on master, see #947, and the two classes here use the
  # scripted cloud host only to restore a fixture wallet or reach a screen
  IOS_UI_SUITES: >-
    CoveUITests/OnboardingFullLaunchUITests,
    CoveUITests/ReceiveTextSizeFullLaunchUITests,
    CoveUITests/WatchOnlyUpgradeFullLaunchUITests,
    CoveUITests/UtxoLockFullLaunchUITests,
    CoveUITests/NfcScanPrivacyCoverFullLaunchUITests,
    CoveUITests/BiometricLockFullLaunchUITests,
    CoveUITests/HardwareSigningFullLaunchUITests,
    CoveUITests/PublicKeyImportFullLaunchUITests,
    CoveUITests/TapSignerLayoutFullLaunchUITests,
    CoveUITests/KeyTeleportReceiveFullLaunchUITests,
    CoveUITests/KeyTeleportSendFullLaunchUITests,
    CoveUITests/LargeTextWordBreakFullLaunchUITests,
    CoveUITests/KeyTeleportAppScannerFullLaunchUITests,
    CoveCloudBackupUITests/CloudBackupRestoreAllFullAppUITests,
    CoveCloudBackupUITests/CloudBackupOnboardingLateOfferFullAppUITests,
    CoveCloudBackupUITests/PrivateKeyExportFullAppUITests,
    CoveCloudBackupUITests/CloudBackupLargeTextFullAppUITests,
    CoveCloudBackupUITests/CloudBackupDeleteFromCloudFullAppUITests,
    CoveCloudBackupUITests/CloudBackupNetworkFullAppUITests,
    CoveCloudBackupUITests/CloudBackupLocalDeleteFullAppUITests,
    CoveCloudBackupUITests/CloudBackupSyncNowFullAppUITests,
    CoveCloudBackupUITests/CloudBackupEnableRecoveryFullAppUITests,
    CoveCloudBackupUITests/CloudBackupDisableFullAppUITests,
    CoveCloudBackupUITests/CloudBackupTurnOffFullAppUITests
  ANDROID_FLAVOURS: Dev UiTest
  # tests a manual run names, read by tools/ui-test-plan.sh; empty on every other trigger
  IOS_TESTS: ${{ inputs.ios_tests }}
  ANDROID_TESTS: ${{ inputs.android_tests }}

jobs:
  # on a labeled PR, picks the platforms the change reaches, as CI's changes job does, see
  # .github/scripts/ci_changes.py; every other trigger runs both, and a job skips only when the
  # changes job succeeded and said 'false', so a failed changes job runs both too
  changes:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    runs-on: ubuntu-24.04
    outputs:
      ios_ui: ${{ steps.plan.outputs.ios_ui }}
      android_instrumented: ${{ steps.plan.outputs.android_instrumented }}
      ios_named: ${{ steps.named.outputs.ios_named }}
      android_named: ${{ steps.named.outputs.android_named }}
    steps:
      # the merge commit and both its parents; diffing names reads trees, never blobs
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Pick the platforms this change needs
        id: plan
        run: python3 -I .github/scripts/ci_changes.py

      # a manual run that names tests for only one platform has nothing for the other, whose jobs
      # then skip before taking a runner; inputs are read without whitespace, as
      # tools/ui-test-plan.sh reads them, so a blank input counts as none
      - name: Pick the platforms a manual run names tests for
        id: named
        run: |
          ios=$(printf '%s' "$IOS_TESTS" | tr -d '[:space:]')
          android=$(printf '%s' "$ANDROID_TESTS" | tr -d '[:space:]')
          ios_named=true
          android_named=true
          if [[ -n $ios$android ]]; then
            [[ -n $ios ]] || ios_named=false
            [[ -n $android ]] || android_named=false
          fi

          echo "ios_named=$ios_named" | tee -a "$GITHUB_OUTPUT"
          echo "android_named=$android_named" | tee -a "$GITHUB_OUTPUT"

  android-instrumented:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests')) && (needs.changes.result != 'success' || (needs.changes.outputs.android_instrumented != 'false' && needs.changes.outputs.android_named != 'false')) }}
    # Dev keeps its old check name; a UiTest shard adds its slice, as in `(UiTest 2/3)`
    name: android-instrumented (${{ matrix.flavour }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    # each job's tests took 15 to 25 minutes after about 8 minutes of setup, and a slow hosted
    # emulator once ran the unsharded UiTest flavour 20 minutes past its usual time
    timeout-minutes: 60
    # one flavour per job: with both in one job the hosted runner shut down about 35 minutes in, twice
    # UiTest runs about twice Dev's test time, so it splits three ways by whole class, see
    # rust/xtask/src/android_ui_shard.rs; the matrix is fixed, not planned by an earlier job, so a
    # run cancelled before it starts still names its checks the way the run that replaces it does
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: Dev
            shard: "1/1"
          - flavour: UiTest
            shard: "1/3"
          - flavour: UiTest
            shard: "2/3"
          - flavour: UiTest
            shard: "3/3"
    steps:
      - uses: actions/checkout@v6

      # a manual run that names tests runs only those, so a job may have nothing to do
      - name: Plan this job's tests
        id: plan
        env:
          PLATFORM: android
          FLAVOUR: ${{ matrix.flavour }}
        run: tools/ui-test-plan.sh

      - name: Install Rust toolchain
        if: steps.plan.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        if: steps.plan.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust-android-x86_64
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # xtask deals the flavour's classes, or the ones a manual run names, out to the shards longest
      # first by the times in rust/xtask/src/android_ui_shard/class_seconds.tsv, keeping each class
      # whole since UtxoLockFullLaunchTest's second stage needs its first on the same device; the
      # last shard of a full run excludes the others' classes instead of listing its own, so a
      # class xtask doesn't find still runs, and a shard with nothing to run stops here
      - name: List this shard's test classes
        id: shard
        if: steps.plan.outputs.run == 'true'
        env:
          FLAVOUR: ${{ matrix.flavour }}
          SHARD: ${{ matrix.shard }}
          TESTS: ${{ steps.plan.outputs.tests }}
        run: |
          cd rust
          plan=$(cargo run --locked -q -p xtask -- android-ui-shard --flavour "$FLAVOUR" --shard "$SHARD" --tests "$TESTS")
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"

      - name: Enable KVM for the emulator
        if: steps.shard.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up just
        if: steps.shard.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup Java
        if: steps.shard.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # restores the Gradle User Home that CI's compile-android job writes on master, so the job
      # rarely downloads the Kotlin compiler from its GitHub release redirect, which can 504;
      # read-only so the scheduled master run doesn't save a different set under the shared key
      - name: Setup Gradle
        if: steps.shard.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Install build dependencies
        if: steps.shard.outputs.run == 'true'
        run: cd rust && cargo --locked xtask install-deps

      # the hosted emulator is x86_64, which the default arm64-only build skips
      - name: Build Rust FFI for the x86_64 emulator
        if: steps.shard.outputs.run == 'true'
        run: just xtask build-android debug --x86-64

      # the TAPSIGNER emulator runs in a Python environment uv builds
      - name: Set up uv
        if: steps.shard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.3

      # the recipe starts cove-fake-node and the hardware signer host on the first host port
      # block, 39100-39111, and forwards them to 39000-39002 and 39010-39011 in the emulator, for
      # the tests that fund a wallet or sign with a hardware wallet
      - name: Run instrumented tests
        if: steps.shard.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # headroom for the software-rendered launcher, which stops responding on a busy emulator
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # a stalled foreground launcher otherwise gets an "isn't responding" dialog that takes taps,
          # Back and focus from the app under test, and UiAutomator can't read it to press Wait; with
          # error dialogs hidden Android kills the launcher and restarts home instead, and it reads
          # the setting when it changes, so it applies to the tests started on the next line
          script: |
            adb shell settings put global hide_error_dialogs 1
            just android-instrumented-ci "$FLAVOUR" "$ANDROID_TESTS" "$ANDROID_NOT_TESTS"
        env:
          FLAVOUR: ${{ matrix.flavour }}
          # this shard's classes, or empty to run every test in the flavour but the excluded ones
          ANDROID_TESTS: ${{ steps.shard.outputs.tests }}
          ANDROID_NOT_TESTS: ${{ steps.shard.outputs.not_tests }}

      # the emulator has died mid-run with no output of its own, so record whether the host killed it
      - name: Show host memory and kernel kills
        if: failure()
        run: |
          free -m
          sudo dmesg --ctime | grep -iE 'out of memory|oom|killed process' || echo "no kernel OOM kills recorded"

      # uploaded on success too, since its JUnit XML is what `cargo xtask android-ui-timings`
      # refreshes the shard timings from; named for the job's place in the matrix, as a shard's
      # slash can't be in an artifact name
      - name: Upload Android test reports
        if: ${{ !cancelled() && steps.shard.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-reports-${{ matrix.flavour }}-${{ strategy.job-index }}
          path: |
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          retention-days: 30
          # a re-run job uploads under the same name
          overwrite: true

      # a separate artifact keeps the report layout; the host overwrites the log at each card start
      - name: Upload TAPSIGNER emulator log
        if: failure() && steps.shard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tapsigner-emulator-log-android-${{ matrix.flavour }}-${{ strategy.job-index }}
          path: rust/target/ui-test-host/ecard-*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  ios-ui:
    needs: changes
    # never on a pull request or a push, see the top of this file
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'push' && (needs.changes.result != 'success' || (needs.changes.outputs.ios_ui != 'false' && needs.changes.outputs.ios_named != 'false')) }}
    runs-on: macos-26
    # each shard runs about 22 tests, after 10 to 18 minutes building the Rust library, unless
    # compile-ios cached it, the fake node and the test bundles; a CoveUITests test paid about 3
    # minutes of simulator, runner and coverage overhead on top of its body before coverage was
    # turned off and cloud backup classes shared a simulator, and the slowest hosted runners need
    # headroom beyond the estimate
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # a full run splits across this many macOS runners; fixed for the same reason as the
        # Android flavours
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v6

      # a manual run that names tests runs only those, so a job may have nothing to do
      - name: Plan this job's tests
        id: plan
        env:
          PLATFORM: ios
          SHARD: ${{ matrix.shard }}
        run: tools/ui-test-plan.sh

      - name: Install Rust toolchain
        if: steps.plan.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        if: steps.plan.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          cache-targets: false
          prefix-key: v2-rust-ios
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Set up just
        if: steps.plan.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # a listed method lands on one shard, so the others stop here instead of building
      - name: List this shard's tests
        id: shard
        if: steps.plan.outputs.run == 'true'
        env:
          TESTS: ${{ steps.plan.outputs.tests }}
          SHARD: ${{ steps.plan.outputs.shard }}
        run: |
          cd rust
          tests=$(cargo run --locked -q -p xtask -- ios-ui --test "$TESTS" --shard "$SHARD" --list)
          printf '%s\n' "$tests"
          echo "count=$(printf '%s' "$tests" | grep -c . || true)" >>"$GITHUB_OUTPUT"

      # restores the library compile-ios saved on master for the same Rust, toolchain, Xcode and
      # flags, or builds it; RUSTFLAGS matches compile-ios's, which the key includes
      - name: Build or restore Rust FFI bindings
        if: steps.plan.outputs.run == 'true' && steps.shard.outputs.count != '0'
        uses: ./.github/actions/ios-ffi
        env:
          RUSTFLAGS: -D warnings

      # the TAPSIGNER emulator runs in a Python environment uv builds
      - name: Set up uv
        if: steps.plan.outputs.run == 'true' && steps.shard.outputs.count != '0'
        uses: astral-sh/setup-uv@v10.3.3

      # xtask expands each class into its test methods and keeps this shard's share, builds each
      # scheme once, and runs each CoveUITests test on a fresh clone of a once-booted simulator so
      # it starts at first launch; each CoveCloudBackupUITests class shares one clone and one
      # xcodebuild call, since its host app wipes its data at every launch. It keeps
      # cove-fake-node up on the first port block, 39100-39102, for the tests that fund a wallet
      # from it and the hardware signer host on 39110-39111 for the hardware signing tests
      # xcodebuild passes TEST_RUNNER_-prefixed variables to the test process without the prefix
      - name: Run iOS UI tests
        if: steps.plan.outputs.run == 'true' && steps.shard.outputs.count != '0'
        env:
          TEST_RUNNER_COVE_SKIP_QUARANTINED: "1"
          TESTS: ${{ steps.plan.outputs.tests }}
          SHARD: ${{ steps.plan.outputs.shard }}
        run: cd rust && cargo run --locked -p xtask -- ios-ui --device "iPhone 17" --test "$TESTS" --shard "$SHARD" --results-dir "$RUNNER_TEMP/ios-ui-results"

      # each attempt's bundle and logs are named for its test, or its class when the class run
      # holds several;
      # DerivedData keeps only the newest bundles
      - name: Upload iOS test results
        if: failure() && steps.plan.outputs.run == 'true' && steps.shard.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ios-ui-results
          retention-days: 7

      # a separate artifact keeps the results layout; the host overwrites the log at each card start
      - name: Upload TAPSIGNER emulator log
        if: failure() && steps.plan.outputs.run == 'true' && steps.shard.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: tapsigner-emulator-log-ios-${{ strategy.job-index }}
          path: rust/target/ui-test-host/ecard-*.log
          if-no-files-found: ignore
          retention-days: 7
