name: Stack gate

# posts the stack-top commit status, see .github/scripts/ci_stack_gate.py. A slice of a GitHub stack
# runs only tiers 0 and 1, so its status passes once the stack's top is green on the merge tier;
# every other pull request's passes once its own head is. Since the whole stack merges at once, the
# merge tier then runs once per stack rather than on every slice and every rebase of it.
# workflow_run runs this from master with a token that can post statuses, for forks' pull requests
# too, and re-evaluates a stack when a CI or UI tests run on any of its heads starts or ends, so a
# status follows its stack's top without a job waiting or polling
on:
  workflow_run:
    # retargeting a base and closing a stack's top change which head tests a slice without starting
    # CI, so stack-gate-trigger.yml runs on those instead. This never checks out or runs the pull
    # request's code
    workflows: [CI, UI tests, Stack gate trigger]
    types: [requested, completed]

permissions: {}

jobs:
  stack-top:
    # a trigger run counts once its job ran, which it skips for an edit that leaves the base alone
    if: >-
      (github.event.workflow_run.name == 'Stack gate trigger'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event.workflow_run.name != 'Stack gate trigger'
        && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'))
    # the newest evaluation of a head reads the newest runs, so it replaces an older one still
    # going; on the job rather than the workflow, so an event the if above drops can't cancel one
    concurrency:
      group: stack-gate-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # master's scripts, never a pull request's
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post the stack-top status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/ci_stack_gate.py
