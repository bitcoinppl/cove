name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to diff against so only the jobs its changes need run, such as a stacked branch's parent; empty runs every job"
        required: false
        default: ""
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# a new push cancels the older run on the same PR or branch so runs don't pile up on the limited
# macOS runners. That includes master: squash merges make each master commit contain the ones
# before it, so testing the newest commit covers them, and a burst of merges once queued a full
# macOS set per commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  # picks the jobs below that the change needs, see .github/scripts/ci_changes.py; pushes to master
  # and runs without a diff run them all. Jobs are skipped by their own if rather than a
  # workflow paths filter because a skipped job still reports, and branch protection counts it as
  # passed. A job skips only when the changes job succeeded and said 'false', so a failed or broken
  # changes job runs everything
  # It also skips a macOS job a trusted maintainer's cove-local-ci run already passed on this
  # commit, see .github/scripts/ci_local_results.py, since GitHub runs only a few macOS jobs at once
  changes:
    runs-on: ubuntu-24.04
    # statuses: read lets the local results step list the commit's statuses
    permissions:
      contents: read
      statuses: read
    outputs:
      rustfmt: ${{ steps.plan.outputs.rustfmt }}
      clippy: ${{ steps.plan.outputs.clippy }}
      test: ${{ steps.plan.outputs.test }}
      tapsigner_emulator: ${{ steps.plan.outputs.tapsigner_emulator }}
      qa_manifest: ${{ steps.plan.outputs.qa_manifest }}
      swift_lint: ${{ steps.plan.outputs.swift_lint }}
      ktlint: ${{ steps.plan.outputs.ktlint }}
      compile_ios: ${{ steps.plan.outputs.compile_ios }}
      compile_android: ${{ steps.plan.outputs.compile_android }}
      compile_ios_local: ${{ steps.local.outputs.compile_ios_local }}
      swift_lint_local: ${{ steps.local.outputs.swift_lint_local }}
      test_macos_local: ${{ steps.local.outputs.test_macos_local }}
    steps:
      # the merge commit and both its parents, or with a base input the whole history, so the
      # script finds where the branch left it; diffing names reads trees, never blobs
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.base != '' && '0' || '2' }}
          filter: blob:none
          sparse-checkout: .github/scripts

      # a failure here fails the job before it writes outputs, so every job runs
      - name: Test the job filter
        run: python3 -I -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Pick the jobs this change needs
        id: plan
        env:
          BASE_REF: ${{ inputs.base }}
        run: python3 -I .github/scripts/ci_changes.py

      # a failure here leaves its outputs empty, which runs the macOS jobs, without failing the
      # job and with it the path filter above
      - name: Find macOS jobs a local run passed
        id: local
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # cove-local-ci tests a pull request's head, not the merge commit this run checks out
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # the maintainers whose own Macs run cove-local-ci
          TRUSTED: praveenperera
        run: python3 -I .github/scripts/ci_local_results.py

  rustfmt:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rustfmt != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain with rustfmt available
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cd rust && cargo fmt --all -- --check

  swift-lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift_lint != 'false') && needs.changes.outputs.swift_lint_local != 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust-xtask
      - name: Install pinned Swift lint tools
        run: |
          cd rust
          cargo --locked xtask swift-tools run swiftformat --version
          cargo --locked xtask swift-tools run swiftlint version
      - name: SwiftFormat
        run: cd rust && cargo --locked -q xtask swift-tools run swiftformat --lint ios --reporter github-actions-log --swiftversion 6
      - name: SwiftLint
        run: cd rust && cargo --locked -q xtask swift-tools run swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
      - name: Test Cove Swift lint rules
        run: swift test --package-path tools/cove-swift-lint
      - name: Cove Swift lint rules
        run: swift run --package-path tools/cove-swift-lint cove-swift-lint ios --config .swift-ast-lint.yml

  ktlint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ktlint != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      # a cold Gradle User Home downloads kotlin-compiler-embeddable, which Maven Central
      # redirects to a GitHub release asset; a 504 there fails the configuration cache store,
      # so restore the dependency cache master wrote instead of downloading it every run
      # the basic provider shares one key across jobs, so only compile-android writes it;
      # otherwise this faster job would save first without the compile dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Run ktlint
        run: cd android && ./gradlew ktlintCheck
      - name: Run detekt
        run: cd android && ./gradlew detekt

  compile-android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compile_android != 'false') }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # the only writer of the shared Gradle User Home cache, from master; see the ktlint job
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install build dependencies
        run: cd rust && cargo --locked xtask install-deps

      - name: Build Rust FFI and generate Kotlin bindings
        run: just build-android

      - name: Verify Android bindings are up to date
        shell: bash
        run: |
          bindings_path="android/app/src/main/java/org/bitcoinppl/cove_core"
          status="$(git status --porcelain --untracked-files=all -- "$bindings_path")"

          if [[ -n "$status" ]]; then
            echo "Android bindings are out of date. Run 'just build-android' and commit the regenerated bindings."
            echo
            git status --short --untracked-files=all -- "$bindings_path"
            echo
            git diff --stat -- "$bindings_path" || true
            exit 1
          fi

      - name: Compile Android
        run: cd android && ./gradlew assembleDevDebug

      - name: Run Android unit tests
        run: cd android && ./gradlew testDevDebugUnitTest

  compile-ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compile_ios != 'false') && needs.changes.outputs.compile_ios_local != 'true' }}
    runs-on: macos-26
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          cache-targets: false
          prefix-key: v2-rust-ios

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build Rust FFI bindings
        run: just build-ios

      - name: Verify iOS bindings are up to date
        shell: bash
        run: |
          bindings_path="ios/CoveCore/Sources/CoveCore/generated"
          status="$(git status --porcelain --untracked-files=all -- "$bindings_path")"

          if [[ -n "$status" ]]; then
            echo "iOS bindings are out of date. Run 'just build-ios' and commit the regenerated bindings."
            echo
            git status --short --untracked-files=all -- "$bindings_path"
            echo
            git diff --stat -- "$bindings_path" || true
            exit 1
          fi

      - name: Compile iOS
        run: cd ios && xcodebuild -scheme Cove -sdk iphonesimulator -arch arm64 build

      - name: Run iOS unit tests
        run: cd ios && xcodebuild -scheme Cove -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -only-testing:CoveTests -parallel-testing-enabled NO test

  qa-manifest:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.qa_manifest != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      # fails when a checklist row names a test or path that no longer exists
      - name: Check QA checklist manifest
        run: cd rust && cargo run --locked -p xtask -- qa check

      # the device scripts only run on attached devices, so CI checks their parsers and tap guard offline
      - name: Test device-script helpers
        run: python3 -I -m unittest discover -s qa/device -p "test_*.py"

      # the iOS device scripts import wdalib from tools/wda, so its commands are checked against a mock WDA
      - name: Test WebDriverAgent tools
        run: tools/wda/test/run-mock-tests.sh

      # here rather than in the changes job, which every job waits on, so no run waits for mypy to
      # install; a change to these scripts is under .github, which runs this job
      - name: Type check the CI scripts
        run: pipx run --spec mypy==2.4.0 mypy --strict --python-version 3.12 .github/scripts

  # one job per runner, not a matrix: a matrix job its if skips reports a single check without the
  # runner in its name, while branch protection waits on these two names
  test-ubuntu:
    name: test (ubuntu-24.04)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-24.04
    # the job took at most 15 minutes over 37 runs, a cold build included; nextest's ci profile
    # bounds each test, so this catches a hung build or step
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps: &rust-test-steps
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # the key the matrix job used, so both jobs keep the caches it saved for each runner OS
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust
          shared-key: test

      - name: Set up cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # the ci profile in rust/.config/nextest.toml kills a hung test after a few minutes
      - name: Run tests
        run: cd rust && cargo nextest run --locked --workspace --profile ci

      # nextest can't run doctests, so libtest runs them under a step limit instead
      - name: Run doctests
        timeout-minutes: 10
        run: cd rust && cargo test --locked --workspace --doc

  test-macos:
    name: test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test != 'false') && needs.changes.outputs.test_macos_local != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps: *rust-test-steps

  # the TAPSIGNER tests are ignored in the plain test run because they need Coinkite's card
  # emulator; this job installs it and fails when the emulator is missing or a test fails
  tapsigner-emulator:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tapsigner_emulator != 'false') }}
    runs-on: ubuntu-24.04
    # at most 7 minutes over 37 runs, a cold build included
    timeout-minutes: 12
    env:
      RUSTFLAGS: -D warnings
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - name: Set up just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run TAPSIGNER emulator tests
        run: just test-tapsigner-emulator

  clippy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.clippy != 'false') }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - run: cd rust && cargo clippy --locked --all-targets --all-features -- -D warnings
