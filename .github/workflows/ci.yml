name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to diff against so only the jobs its changes need run, such as a stacked branch's parent; empty runs every job"
        required: false
        default: ""
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# a new push to a PR cancels its older run so stacked PRs don't pile up on the
# limited macOS runners; master pushes key on run_id so every commit is tested
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  # picks the jobs below that the change needs, see .github/scripts/ci-changes.sh; pushes to master
  # and runs without a diff run them all. Jobs are skipped by their own if rather than a
  # workflow paths filter because a skipped job still reports, and branch protection counts it as
  # passed. Each if checks for 'false', so a failed or broken changes job runs everything
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rustfmt: ${{ steps.plan.outputs.rustfmt }}
      clippy: ${{ steps.plan.outputs.clippy }}
      test: ${{ steps.plan.outputs.test }}
      tapsigner_emulator: ${{ steps.plan.outputs.tapsigner_emulator }}
      qa_manifest: ${{ steps.plan.outputs.qa_manifest }}
      swift_lint: ${{ steps.plan.outputs.swift_lint }}
      ktlint: ${{ steps.plan.outputs.ktlint }}
      compile_ios: ${{ steps.plan.outputs.compile_ios }}
      compile_android: ${{ steps.plan.outputs.compile_android }}
    steps:
      # the merge commit and both its parents, or with a base input the whole history, so the
      # script finds where the branch left it; diffing names reads trees, never blobs
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.base != '' && '0' || '2' }}
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Pick the jobs this change needs
        id: plan
        env:
          BASE_REF: ${{ inputs.base }}
        run: .github/scripts/ci-changes.sh

  rustfmt:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rustfmt != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain with rustfmt available
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cd rust && cargo fmt --all -- --check

  swift-lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift_lint != 'false' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust-xtask
      - name: Install pinned Swift lint tools
        run: |
          cd rust
          cargo --locked xtask swift-tools run swiftformat --version
          cargo --locked xtask swift-tools run swiftlint version
      - name: SwiftFormat
        run: cd rust && cargo --locked -q xtask swift-tools run swiftformat --lint ios --reporter github-actions-log --swiftversion 6
      - name: SwiftLint
        run: cd rust && cargo --locked -q xtask swift-tools run swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
      - name: Test Cove Swift lint rules
        run: swift test --package-path tools/cove-swift-lint
      - name: Cove Swift lint rules
        run: swift run --package-path tools/cove-swift-lint cove-swift-lint ios --config .swift-ast-lint.yml

  ktlint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ktlint != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      # a cold Gradle User Home downloads kotlin-compiler-embeddable, which Maven Central
      # redirects to a GitHub release asset; a 504 there fails the configuration cache store,
      # so restore the dependency cache master wrote instead of downloading it every run
      # the basic provider shares one key across jobs, so only compile-android writes it;
      # otherwise this faster job would save first without the compile dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Run ktlint
        run: cd android && ./gradlew ktlintCheck
      - name: Run detekt
        run: cd android && ./gradlew detekt

  compile-android:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.compile_android != 'false' }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # the only writer of the shared Gradle User Home cache, from master; see the ktlint job
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install build dependencies
        run: cd rust && cargo --locked xtask install-deps

      - name: Build Rust FFI and generate Kotlin bindings
        run: just build-android

      - name: Verify Android bindings are up to date
        shell: bash
        run: |
          bindings_path="android/app/src/main/java/org/bitcoinppl/cove_core"
          status="$(git status --porcelain --untracked-files=all -- "$bindings_path")"

          if [[ -n "$status" ]]; then
            echo "Android bindings are out of date. Run 'just build-android' and commit the regenerated bindings."
            echo
            git status --short --untracked-files=all -- "$bindings_path"
            echo
            git diff --stat -- "$bindings_path" || true
            exit 1
          fi

      - name: Compile Android
        run: cd android && ./gradlew assembleDevDebug

      - name: Run Android unit tests
        run: cd android && ./gradlew testDevDebugUnitTest

  compile-ios:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.compile_ios != 'false' }}
    runs-on: macos-26
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          cache-targets: false
          prefix-key: v2-rust-ios

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build Rust FFI bindings
        run: just build-ios

      - name: Verify iOS bindings are up to date
        shell: bash
        run: |
          bindings_path="ios/CoveCore/Sources/CoveCore/generated"
          status="$(git status --porcelain --untracked-files=all -- "$bindings_path")"

          if [[ -n "$status" ]]; then
            echo "iOS bindings are out of date. Run 'just build-ios' and commit the regenerated bindings."
            echo
            git status --short --untracked-files=all -- "$bindings_path"
            echo
            git diff --stat -- "$bindings_path" || true
            exit 1
          fi

      - name: Compile iOS
        run: cd ios && xcodebuild -scheme Cove -sdk iphonesimulator -arch arm64 build

      - name: Run iOS unit tests
        run: cd ios && xcodebuild -scheme Cove -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -only-testing:CoveTests -parallel-testing-enabled NO test

  qa-manifest:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.qa_manifest != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      # fails when a checklist row names a test or path that no longer exists
      - name: Check QA checklist manifest
        run: cd rust && cargo run --locked -p xtask -- qa check

      # the device scripts only run on attached devices, so CI checks their parsers and tap guard offline
      - name: Test device-script helpers
        run: python3 -I -m unittest discover -s qa/device -p "test_*.py"

      # the iOS device scripts import wdalib from tools/wda, so its commands are checked against a mock WDA
      - name: Test WebDriverAgent tools
        run: tools/wda/test/run-mock-tests.sh

  # one job per runner, not a matrix: a matrix job its if skips reports a single check without the
  # runner in its name, while branch protection waits on these two names
  test-ubuntu:
    name: test (ubuntu-24.04)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps: &rust-test-steps
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # the key the matrix job used, so both jobs keep the caches it saved for each runner OS
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust
          shared-key: test

      - name: Run tests
        run: cd rust && cargo test --locked --workspace

  test-macos:
    name: test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps: *rust-test-steps

  # the TAPSIGNER tests are ignored in the plain test run because they need Coinkite's card
  # emulator; this job installs it and fails when the emulator is missing or a test fails
  tapsigner-emulator:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tapsigner_emulator != 'false' }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - name: Set up just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run TAPSIGNER emulator tests
        run: just test-tapsigner-emulator

  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.clippy != 'false' }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-bin: false
          prefix-key: v1-rust

      - run: cd rust && cargo clippy --locked --all-targets --all-features -- -D warnings
