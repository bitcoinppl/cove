[[row]]
id = "s17-sender-psbt-error-physical-screenshot"
section = "17"
title = "Sender PSBT error physical screenshot"
platforms = ["android"]
target = "ui"
paths = [
    "android/app/src/main/java/org/bitcoinppl/cove/flows/keyteleport/**",
]
coverage = [
    "android-instrumented:android/app/src/androidTest/java/org/bitcoinppl/cove/flows/keyteleport/KeyTeleportPasteRejectionTest.kt::senderRejectsARawPsbtPasteByAskingForTheReceiverRequest",
]
# 1.4.0: ios N/A, android HUMAN
# the protected screen returns no screencap over adb, so the test captures the error dialog and the sender after OK from inside the app (Pictures/cove-layout-screenshots) and checks that the sender still takes a paste after OK
# the dialog's title, whole message and OK, and the sender's title and instructions after OK, are required by name; each, and every other text in the dialog and on the sender after OK, must match a reference rendering of its own text layout drawn in its own colour over the background beside it
# a text matches when at most 2% of its glyph-core pixels (reference coverage 75% or more) are off the reference, and at most 1% fall under WCAG AA contrast (4.5:1, or 3:1 for large text) measured from the captured pixels, so a missing, covered, overdrawn, wrong, faint or faded text fails
# since the reference is drawn from the text's own layout, every text in the dialog and on the sender after OK must also lay out all its lines, with none ellipsized and none wider or taller than the layout
# dialog texts must also keep their laid-out size, so a parent does not clip them, stay inside the dialog and not overlap

