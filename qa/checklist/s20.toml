[[row]]
id = "s20-ios-to-android-complete-keyteleport-migration"
section = "20"
title = "iOS to Android complete KeyTeleport migration"
platforms = ["ios", "android"]
target = "manual"
paths = [
    "rust/src/key_teleport.rs",
    "rust/src/manager/key_teleport_manager.rs",
    "rust/src/manager/key_teleport_manager/**",
    "ios/Cove/Flows/KeyTeleportFlow/**",
    "android/app/src/main/java/org/bitcoinppl/cove/flows/keyteleport/**",
]
coverage = [
    "human",
    "rust:rust/src/manager/key_teleport_manager/tests/round_trip.rs::twelve_word_mnemonic_transfer_imports_the_sender_wallet",
    "ios-ui:ios/CoveUITests/KeyTeleportSendFullLaunchUITests.swift::testSentWordsShowTheQrCodeAndPasswordOneAtATime",
    "android-instrumented:android/app/src/androidTest/java/org/bitcoinppl/cove/flows/keyteleport/KeyTeleportMnemonicReviewTest.kt::finishWithoutImportingAddsNoWalletAndImportWalletAddsOne",
]
# 1.4.0: ios HUMAN, android HUMAN
# round_trip.rs runs the sending and receiving rust managers against each other and checks the
# received wallet's fingerprint and first address. ios sends the wallet's words to the host playing
# the android phone, which decodes ios's response qr from a screenshot with core image. android
# receives words from an in-process rust peer through the qr seam and imports them. no test has one
# platform's camera read the other's qr rendering, so that stays human: android's ml kit scanner
# reading the core image qr codes ios shows, and ios's avfoundation scanner reading the zxing qr
# codes android shows, in both the request and the response direction

