# wallet leaves the local rows as soon as the change is sent, even when the detail refresh fails,
# and is listed once, under Not on This Device, after the cloud-only rows are read again. a refresh
# or verification that read the local wallets before the delete and lands after it does not list
# the wallet as local again
# ui tests on both platforms delete the wallet through wallet settings and every confirmation dialog its count calls for, two for the restored watch-only fixture wallet and three with the final warning's cloud recovery text for a new unverified hot wallet, then restore it from its cloud-only row; both scripted clouds drop deleted backups, so a stray cloud delete would fail them
# the ui tests reopen cloud backup after the delete, so they don't show that an already-open cloud backup updates without the change notification

