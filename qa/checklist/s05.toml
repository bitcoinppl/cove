# 1.4.0: ios HUMAN, android HUMAN
# rust tests cover inventory staying incomplete until the provider confirms it; the ios per-row restore and delete buttons read isDetailInventoryReady and no ios ui test asserts they stay disabled
# the android test is partial coverage: it holds the provider listing while a known inventory is checked again after a failed refresh, and checks that no listed cloud-only row, open action sheet or delete forever confirmation can restore or delete until the provider confirms the inventory
# the first inventory load still needs a person on android, since onboarding can start inventory discovery before a test can hold the listing, so a regression that treats cached rows as confirmed during first-launch discovery would go uncaught

