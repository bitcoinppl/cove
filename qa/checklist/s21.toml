[[row]]
id = "s21-cloud-disaster-recovery-journey"
section = "21"
title = "Cloud disaster recovery journey"
platforms = ["ios", "android"]
target = "manual"
paths = [
    "rust/src/manager/cloud_backup_manager.rs",
    "rust/src/manager/cloud_backup_manager/**",
    "ios/Cove/CloudBackupManager.swift",
    "ios/Cove/CloudBackupPresentationCoordinator.swift",
    "ios/Cove/Flows/SettingsFlow/CloudBackup*.swift",
    "android/app/src/main/java/org/bitcoinppl/cove/cloudbackup/**",
]
coverage = [
    "human",
]
# 1.4.0: ios HUMAN, android HUMAN
# scripted providers cover the fresh-device restore logic: rust's
# restore_with_one_passkey_restores_wallets_from_all_matching_namespaces, ios's
# CloudBackupRestoreAllFullAppUITests testRestoreAllSkipsACloudCopyOfAWalletAlreadyOnDevice, and
# android's CloudBackupPasskeyScenarioFullLaunchTest prePresentationDiscoveryFailureRetriesOnceThenSucceeds
# and CloudBackupRestoreAllFullLaunchTest runningBatchRestoresEachWalletInTurnAndSkipsTheCopyAlreadyOnDevice
# each restore a clean install through passkey discovery. a person still restores with a real
# passkey synced to a new device, its real prf output, a real icloud or google drive account and a
# clean device
