# 1.4.0: ios HUMAN, android HUMAN
# cove's card logic runs against coinkite's emulator in `just test-tapsigner-emulator`, and the ui
# tests drive the tapsigner screens against it through the transport seam, with a wrong pin and a
# dropped session. the emulator has no rate limit, so mock-card rust tests count a positive auth
# delay down with one wait per second and a countdown message, on connect and in a cvc probe, and
# keep a 429 a rate limit instead of a wrong pin. a person still uses a physical card over the
# corenfc or isodep session, and sits through the card's real 15 second delay after three wrong pins

