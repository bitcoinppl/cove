[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
color-eyre = "0.6.5"
xshell = "0.2.7"
colored = "3.1.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "1.1.2"
jiff = { workspace = true }
glob = "0.3.3"
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
parking_lot = { workspace = true }
memchr = { workspace = true }
# for check-error-text, which parses the library sources and reports attribute lines
syn = { version = "2.0.117", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
# stops UI test services when xtask is interrupted or terminated
signal-hook = "0.4.6"

# for util sign-psbt
bdk_wallet = { version = "3.0.0", features = ["keys-bip39"] }
bitcoin = "0.32.9"
bip39 = "2.2.2"
base64 = "0.22.1"
cove-ur = { path = "../crates/cove-ur" }
qrcode = "0.14.1"
image = { version = "0.25.10", features = ["gif"] }
gif = "0.14.2"
bbqr = { workspace = true }
foundation-ur = { version = "0.5.0", default-features = false, features = ["std"] }
# for the ui test host's checks on drawn export frames, which bbqr and foundation-ur skip
crc = "3.4.0"
data-encoding = "2.11.0"
flate2 = { version = "1.1.9", default-features = false, features = ["any_zlib", "zlib-rs"] }
minicbor = { version = "0.24.4", features = ["std"] }
hex = "0.4.3"
# for the ui test host's KeyTeleport peer
keyteleport = "0.1.0"
aes = { workspace = true }
ctr = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# for the ui test host's BIP 77 Payjoin directory, OHTTP relay and receiver, the layout of the
# Rust end-to-end tests' harness in rust/src/test_support/payjoin.rs
payjoin = { workspace = true }
payjoin-mailroom = { version = "0.1.3", default-features = false, features = ["_manual-tls"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rcgen = "0.14.7"
rustls = { version = "0.23.40", features = ["ring"], default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread"] }
url = { workspace = true }
# the Payjoin directory's storage, removed when the host stops
tempfile = "3.27.0"

[lints]
workspace = true
