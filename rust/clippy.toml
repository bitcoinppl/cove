# a passkey request presents platform UI, so it may start only under a live user permit; the
# authorization retrier checks one before each attempt and is the only allowed caller
disallowed-methods = [
    { path = "cove_device::passkey::PasskeyAccess::create_passkey", reason = "present passkey requests through PlatformAuthorizationRetrier, which checks the user permit" },
    { path = "cove_device::passkey::PasskeyAccess::authenticate_with_prf", reason = "present passkey requests through PlatformAuthorizationRetrier, which checks the user permit" },
    { path = "cove_device::passkey::PasskeyAccess::discover_and_authenticate_with_prf", reason = "present passkey requests through PlatformAuthorizationRetrier, which checks the user permit" },

    # every outbound connection takes the Tor route while Tor is on, so clients are only built
    # from a `NetworkRoute`: reqwest in `cove_http`, Electrum and Esplora in `node::client`. A raw
    # constructor or socket skips the route and could connect outside Tor
    { path = "reqwest::Client::new", reason = "build HTTP clients with cove_http::new_client, which takes the Tor route" },
    { path = "reqwest::Client::builder", reason = "build HTTP clients with cove_http::new_client, which takes the Tor route" },
    { path = "reqwest::ClientBuilder::new", reason = "build HTTP clients with cove_http::new_client, which takes the Tor route" },
    { path = "electrum_client::Client::new", reason = "connect through node::client::NodeClient, which takes the Tor route" },
    { path = "electrum_client::Client::from_config", reason = "connect through node::client::NodeClient, which takes the Tor route" },
    { path = "esplora_client::Builder::build_async", reason = "connect through node::client::NodeClient, which takes the Tor route" },
    { path = "std::net::TcpStream::connect", reason = "outbound sockets skip the Tor route; use a route-aware client" },
    { path = "std::net::TcpStream::connect_timeout", reason = "outbound sockets skip the Tor route; use a route-aware client" },
    { path = "tokio::net::TcpStream::connect", reason = "outbound sockets skip the Tor route; use a route-aware client" },
]
